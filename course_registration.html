<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Course Registration</h2>
        <form action="#" method="post">
            <label for="course_name">Course Name</label>
            <input type="text" id="course_name" name="course_name" placeholder="Enter course name" required>

            <label for="course_code">Course Code</label>
            <input type="text" id="course_code" name="course_code" placeholder="Enter course code" required>

            <label for="instructor">Instructor</label>
            <input type="text" id="instructor" name="instructor" placeholder="Enter instructor's name" required>

            <label for="credits">Credits</label>
            <input type="number" id="credits" name="credits" placeholder="Enter credits" required>

            <input type="submit" value="Register Course">
        </form>
    </div>
</body>
</html>
