<!DOCTYPE html>
<html>
<head>
    <title>Book Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Book Registration</h2>
        <form action="#" method="post">
            <label for="title">Book Title</label>
            <input type="text" id="title" name="title" placeholder="Enter book title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="Enter author's name" required>

            <label for="isbn">ISBN Number</label>
            <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN" required>

            <label for="year">Publication Year</label>
            <input type="number" id="year" name="year" placeholder="Enter year" required>

            <input type="submit" value="Register Book">
        </form>
    </div>
</body>
</html>
